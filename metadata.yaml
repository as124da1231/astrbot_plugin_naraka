name: astrbot_plugin_naraka
desc: 通过小黑盒查询永劫无间端游近期战绩与单局详情，支持昵称搜索、模式筛选和 QQ 表情回应。
version: 1.0.9
author: as124da1231
repo: "https://github.com/as124da1231/astrbot_plugin_naraka"
display_name: 永劫无间战绩查询
short_desc: 永劫无间端游玩家战绩查询
help: "战绩查询 <昵称或角色ID> [模式]：场均概览\n详细查询 <昵称或角色ID> [模式]：逐场详情\n永劫赛季 <昵称或角色ID> [模式] [当前/全部/赛季名]：赛季总览\n永劫搜索 <昵称>：搜索角色ID\n/永劫退出：管理员清除登录\n/永劫登录：管理员扫码登录小黑盒，默认仅私聊"
astrbot_version: ">=4.10.4"
support_platforms:
