name: astrbot_plugin_naraka
desc: 通过小黑盒查询永劫无间端游近期战绩与单局详情，支持昵称搜索、模式筛选、三种数据模式与自动绑定兜底。
version: 1.5.0
author: as124da1231
repo: "https://github.com/as124da1231/astrbot_plugin_naraka"
display_name: 永劫无间战绩查询
short_desc: 永劫无间端游玩家战绩查询
help: "战绩查询 <昵称> [模式]：场均概览（搜不到会自动绑定后重查）\n详细查询 <昵称> [模式]：逐场详情\n战绩绑定 <昵称> [模式]：强制走绑定通道查询\n战绩解绑 <昵称>：手动解绑（任何人可用）\n永劫赛季 <昵称> [模式] [当前/全部/赛季名]：赛季总览\n永劫搜索 <昵称>：搜索玩家（免登录）\n/永劫残留：管理员查看并重试解绑残留\n/永劫退出：管理员清除登录\n/永劫登录：管理员按当前数据模式扫码登录\n注：不支持按角色ID查询，请用昵称"
astrbot_version: ">=4.10.4"
support_platforms:
  - aiocqhttp
